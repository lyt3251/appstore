<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Japan Travel Lens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f9f9fb; --card: #fff; --text: #1a1a1a; --secondary: #5f6b7a;
      --accent: #0c7a5a; --accent-light: #e6f4ef; --border: #e4e7ec; --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.7; padding: 24px 16px 80px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { background: var(--accent); color: #fff; border-radius: var(--radius); padding: 36px 32px 28px; margin-bottom: 32px; text-align: center; }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: .75; }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .lang-card { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; text-decoration: none; color: var(--text); transition: border-color 0.15s, box-shadow 0.15s; }
    .lang-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .lang-card .left { display: flex; align-items: center; gap: 14px; }
    .lang-card .flag { font-size: 28px; line-height: 1; }
    .lang-card .names .primary { font-size: 16px; font-weight: 700; }
    .lang-card .names .secondary { font-size: 12px; color: var(--secondary); margin-top: 2px; }
    .lang-card .arrow { color: var(--accent); font-size: 18px; opacity: .6; }
    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--secondary); }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
